name: Commerce consistency
on:
  push:
    paths:
      - 'agent/**'
      - '*.html'
      - 'feeds/**'
      - 'scripts/validate_commerce.py'
      - 'tests/test_commerce_consistency.py'
      - '.github/workflows/commerce-consistency.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '*.html'
      - 'feeds/**'
      - 'scripts/validate_commerce.py'
      - 'tests/test_commerce_consistency.py'
      - '.github/workflows/commerce-consistency.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -W error scripts/validate_commerce.py
      - run: python -W error -m unittest tests/test_commerce_consistency.py -v
